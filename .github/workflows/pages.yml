name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/40 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - id: deploy
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          OUTPUT=$(npx vercel deploy --temporary --yes --force \
            --env "OPENAI_API_KEY=$OPENAI_API_KEY" \
            --build-env "OPENAI_API_KEY=$OPENAI_API_KEY")
          URL=$(printf '%s\n' "$OUTPUT" | grep -oE 'https://[A-Za-z0-9.-]+\.vercel.app' | head -1)
          if [ -z "$URL" ]; then
            echo "Vercel deploy did not return a URL"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Twin API host ready"

  build:
    needs: api
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_TWIN_API: ${{ needs.api.outputs.url }}/api/twin/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Omit the twin API from the static export
        run: rm -rf app/api
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
